
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love You</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>

<canvas id="heart"></canvas>

<audio id="music" loop>
    <source src="imprisoned-xii.mp3" type="audio/mpeg">
</audio>

<script>
const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");
const music = document.getElementById("music");

let width, height, scale;
let particles = [];
let startTime = null;
let musicStarted = false;

const DURATION = 60000;

const COLORS = [
    "#FF1493",
    "#FF007F",
    "#FF69B4",
    "#DB1478",
    "#FF32A0"
];

const WORDS = [
    "love you",
    "Love You",
    "LOVE YOU"
];

function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width * dpr;
    canvas.height = height * dpr;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    scale = Math.min(width / 42, height / 30);

    createParticles();
}

function heartXY(t) {
    return {
        x: 16 * Math.pow(Math.sin(t), 3),
        y: -(13 * Math.cos(t)
            - 5 * Math.cos(2 * t)
            - 2 * Math.cos(3 * t)
            - Math.cos(4 * t))
    };
}

function screenXY(x, y) {
    return {
        x: width / 2 + x * scale,
        y: height / 2 + y * scale
    };
}

function createParticles() {
    particles = [];

    const placed = [];
    const total = 160;

    // Contorno do coração
    for (let i = 0; i < total; i++) {
        const t = i / total * Math.PI * 2;
        const heart = heartXY(t);
        const pos = screenXY(heart.x, heart.y);

        if (placed.some(p =>
            Math.hypot(pos.x - p.x, pos.y - p.y) < 15
        )) continue;

        placed.push(pos);

        particles.push({
            ...pos,
            delay: 5000 + (i / total) * 25000,
            alpha: 0,
            color: COLORS[Math.floor(Math.random() * COLORS.length)],
            word: WORDS[Math.floor(Math.random() * WORDS.length)],
            size: 10 + Math.random() * 5,
            flicker: Math.random() * Math.PI * 2
        });
    }

    // Preenchimento do coração
    const fill = [];
    let attempts = 0;

    while (fill.length < 130 && attempts < 15000) {
        attempts++;

        const t = Math.random() * Math.PI * 2;
        const r = Math.random() * 0.86;

        const heart = heartXY(t);
        const pos = screenXY(heart.x * r, heart.y * r);

        if (placed.some(p =>
            Math.hypot(pos.x - p.x, pos.y - p.y) < 17
        )) continue;

        placed.push(pos);
        fill.push(pos);
    }

    fill.forEach((pos, i) => {
        particles.push({
            ...pos,
            delay: 30000 + (i / 130) * 19000,
            alpha: 0,
            color: COLORS[Math.floor(Math.random() * COLORS.length)],
            word: WORDS[Math.floor(Math.random() * WORDS.length)],
            size: 9 + Math.random() * 4,
            flicker: Math.random() * Math.PI * 2
        });
    });
}

function drawParticle(p, elapsed) {
    if (elapsed < p.delay) return;

    const progress = Math.min(
        1,
        (elapsed - p.delay) / 1800
    );

    const alpha = progress * 255;

    const flicker = 0.8 +
        0.2 * Math.sin(elapsed * 0.004 + p.flicker);

    ctx.save();

    ctx.globalAlpha = (alpha / 255) * flicker;

    ctx.font = `bold ${p.size}px Arial`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.shadowColor = p.color;
    ctx.shadowBlur = 18;
    ctx.fillStyle = p.color;

    ctx.fillText(p.word, p.x, p.y);

    ctx.restore();
}

function drawCenter(elapsed) {
    const centerStart = 49000;

    if (elapsed < centerStart) return;

    const progress = Math.min(
        1,
        (elapsed - centerStart) / 5000
    );

    const alpha = 1 - Math.exp(-progress * 5);

    const pulse = 1 +
        0.025 * Math.sin(elapsed * 0.004);

    ctx.save();

    ctx.translate(width / 2, height / 2);
    ctx.scale(pulse, pulse);

    ctx.globalAlpha = alpha;

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.font = `bold ${Math.max(
        25,
        Math.min(54, width * 0.065)
    )}px Georgia`;

    ctx.shadowColor = "#FF1493";
    ctx.shadowBlur = 35;
    ctx.fillStyle = "#FFDCEB";

    ctx.fillText("Love You", 0, 0);

    ctx.restore();
}

function animate(timestamp) {
    if (startTime === null) {
        startTime = timestamp;
    }

    const elapsed = Math.min(
        timestamp - startTime,
        DURATION
    );

    ctx.clearRect(0, 0, width, height);

    particles.forEach(p => {
        drawParticle(p, elapsed);
    });

    drawCenter(elapsed);

    if (elapsed < DURATION) {
        requestAnimationFrame(animate);
    }
}

function startMusic() {
    if (musicStarted) return;

    music.play().then(() => {
        musicStarted = true;
    }).catch(() => {});
}

window.addEventListener("pointerdown", startMusic, {
    once: true
});

window.addEventListener("resize", resize);

resize();
requestAnimationFrame(animate);

</script>

</body>
</html>
